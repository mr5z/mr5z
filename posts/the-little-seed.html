          .book{max-width:clamp(720px, calc((100vh - 230px) * 1.6), 1100px)}

        .book-nav{grid-column:3;justify-self:end}

        .book .turn svg{width:22px;height:22px}

  svg.style.opacity=reduce?"1":"0";stage.appendChild(svg);
  stage.setAttribute("aria-label",p.alt||"");
  var olds=[].slice.call(stage.querySelectorAll("svg")).filter(function(s){return s!==svg;});
  requestAnimationFrame(function(){requestAnimationFrame(function(){svg.style.opacity="1";});});
  setTimeout(function(){olds.forEach(function(o){o.remove();});},reduce?0:1150);
  words.classList.add("out");
  setTimeout(function(){
    var h="";
    if(id==="cover")h='<h1>The Little Seed</h1><p class="sub">A story for small people, and tall ones.</p><div class="choices"><button class="choice" data-go="sp1">Open the book</button></div>';
    else if(p.end){var key=S.g==="go"?"went":lastEnd==="endH4"?"hope":lastEnd==="endD4"?"dread":"quiet",E=REFLECT[key];
      h='<p class="text">'+E[0]+'</p><p class="endnote">'+E[1]+'</p><p class="closer late">'+CLOSER+'</p><div class="choices late2"><button class="choice" data-restart="1">Read again</button></div>';}
    else if(p.ans){var n=p.ans,t=ANS[n-1],inner;
      if(n===5)inner=t.split("").map(function(ch,i){return'<span class="dz" style="animation-delay:'+(2.2+i*.07).toFixed(2)+'s">'+ch+'</span>';}).join("");
      else inner=t;
      h='<p class="text ans" style="opacity:'+(1-(n-1)*.13).toFixed(2)+';letter-spacing:'+((n-1)*.035).toFixed(3)+'em">“'+inner+'”</p>';}
    else if(p.label!=null)h=p.label?'<p class="season">'+p.label+'</p>':'';
    else{h='<p class="text">'+val(p.text)+'</p>';
      if(p.choices)h+='<div class="choices">'+p.choices.map(function(c){return'<button class="choice" data-k="'+c[1]+'" data-v="'+c[2]+'" data-go="'+c[3]+'">'+c[0]+'</button>';}).join("")+'</div>';}
    words.innerHTML=h;words.classList.remove("out");
  },reduce?0:300);
  bNext.hidden=!!(id==="cover"||p.choices||p.end);
}
function forward(){var p=pages[cur];if(cur==="cover")return show("sp1");if(p.choices||p.end)return;show(val(p.next));}
words.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.restart){S={};return show("cover");}
  if(b.dataset.k)S[b.dataset.k]=b.dataset.v;show(b.dataset.go);});
bNext.addEventListener("click",forward);stage.addEventListener("click",forward);
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")forward();});
window.__book={show:show,set:function(o){S=o;}};
show("cover");
})();
